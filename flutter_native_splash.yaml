flutter_native_splash:
  # --- Common Settings ---
  color: "#FFFFFF"
  image: assets/images/logo1.png

  # --- Dark Mode Settings ---
  color_dark: "#000000"
  image_dark: assets/images/logo2.png

  # --- Android Specifics (Pre-Android 12) ---
  android_gravity: center
  fullscreen: true

  # --- iOS Specifics ---
  ios_content_mode: scaleAspectFit

  # --- Web Specifics ---
  web_image_mode: contain

  # --- Android 12+ Configuration (The Fix) ---
  # Android 12 uses an "Adaptive Icon" system.
  # It puts your image inside a circle.
  android_12:
    image: assets/images/logo1.png
    image_dark: assets/images/logo2.png

    # Background colors are critical for Android 12
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#000000"